{% set name = "pydantic-config" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: ea839a9dbdb56b883529093a5a9b186c8a6393dbb5620d4a629b3948897f2a03

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.7
    - setuptools
    - pip
  run:
    - python >=3.8
    - pydantic-settings >=2.0.1

test:
  imports:
    - pydantic_config
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/jordantshaw/pydantic-config
  summary: Support for pydantic-settings configuration file loading
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/jordantshaw/pydantic-config
  dev_url: https://github.com/jordantshaw/pydantic-config

extra:
  recipe-maintainers:
    - jordantshaw
